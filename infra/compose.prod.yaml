services:

  caddy:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    depends_on:
      app:
        condition: service_healthy

    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      edge:
        ipv4_address: 172.30.10.10


  app:
    image: "ai-enterprise-lab:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}"

    build:
      context: ..
      dockerfile: Dockerfile

    restart: unless-stopped
    stop_grace_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: "production"
      APP_HEALTHCHECK_HOST: "${APP_HEALTHCHECK_HOST:?APP_HEALTHCHECK_HOST is required}"

      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}"

      AI_DEFAULT_ORGANIZATION_SLUG: "${AI_DEFAULT_ORGANIZATION_SLUG:-lab-default}"
      AI_DEFAULT_PROVIDER: "${AI_DEFAULT_PROVIDER:-local_fast}"
      AGENT_TOOL_TIMEOUT_SECONDS: "${AGENT_TOOL_TIMEOUT_SECONDS:-20.0}"
      AGENT_GENERATION_TIMEOUT_SECONDS: "${AGENT_GENERATION_TIMEOUT_SECONDS:-30.0}"

      AI_MAX_PROMPT_CHARS: "${AI_MAX_PROMPT_CHARS:-12000}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-2048}"

      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required}"
      AI_LOCAL_FAST_MODEL: "${AI_LOCAL_FAST_MODEL:-qwen2.5-coder:3b}"
      AI_LOCAL_DEEP_MODEL: "${AI_LOCAL_DEEP_MODEL:-qwen2.5-coder:7b-instruct-q3_K_S}"

      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-1024}"

      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

      REDIS_CONNECT_TIMEOUT_SECONDS: "${REDIS_CONNECT_TIMEOUT_SECONDS:-1.0}"
      REDIS_SOCKET_TIMEOUT_SECONDS: "${REDIS_SOCKET_TIMEOUT_SECONDS:-1.0}"
      REDIS_READINESS_TIMEOUT_SECONDS: "${REDIS_READINESS_TIMEOUT_SECONDS:-3.0}"

      RATE_LIMIT_ENABLED: "true"

      RATE_LIMIT_PUBLIC_GENERATE_PER_MINUTE: "${RATE_LIMIT_PUBLIC_GENERATE_PER_MINUTE:-12}"
      RATE_LIMIT_PUBLIC_GENERATE_BURST: "${RATE_LIMIT_PUBLIC_GENERATE_BURST:-3}"

      RATE_LIMIT_PUBLIC_RAG_PER_MINUTE: "${RATE_LIMIT_PUBLIC_RAG_PER_MINUTE:-12}"
      RATE_LIMIT_PUBLIC_RAG_BURST: "${RATE_LIMIT_PUBLIC_RAG_BURST:-3}"

      RATE_LIMIT_AUTH_PREAUTH_PER_MINUTE: "${RATE_LIMIT_AUTH_PREAUTH_PER_MINUTE:-30}"
      RATE_LIMIT_AUTH_PREAUTH_BURST: "${RATE_LIMIT_AUTH_PREAUTH_BURST:-10}"

      RATE_LIMIT_AUTH_PRINCIPAL_PER_MINUTE: "${RATE_LIMIT_AUTH_PRINCIPAL_PER_MINUTE:-30}"
      RATE_LIMIT_AUTH_PRINCIPAL_BURST: "${RATE_LIMIT_AUTH_PRINCIPAL_BURST:-5}"

      EXTERNAL_AI_ENABLED: "${EXTERNAL_AI_ENABLED:-false}"
      EXTERNAL_AI_PROVIDER: "${EXTERNAL_AI_PROVIDER:-deepseek}"
      EXTERNAL_AI_MODEL: "${EXTERNAL_AI_MODEL:-deepseek-flash}"

      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"

      DEEPSEEK_THINKING_ENABLED: "${DEEPSEEK_THINKING_ENABLED:-true}"
      DEEPSEEK_REASONING_EFFORT: "${DEEPSEEK_REASONING_EFFORT:-high}"

      DEEPSEEK_PRICE_CACHE_HIT_OFFPEAK_PER_M: "${DEEPSEEK_PRICE_CACHE_HIT_OFFPEAK_PER_M:-0.003}"
      DEEPSEEK_PRICE_CACHE_MISS_OFFPEAK_PER_M: "${DEEPSEEK_PRICE_CACHE_MISS_OFFPEAK_PER_M:-0.15}"
      DEEPSEEK_PRICE_OUTPUT_OFFPEAK_PER_M: "${DEEPSEEK_PRICE_OUTPUT_OFFPEAK_PER_M:-0.60}"
      DEEPSEEK_PEAK_MULTIPLIER: "${DEEPSEEK_PEAK_MULTIPLIER:-2.0}"

    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.30.10.10
      - --timeout-keep-alive
      - "5"
      - --timeout-graceful-shutdown
      - "30"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      edge:
        ipv4_address: 172.30.10.20
      backend:
        ipv4_address: 172.30.20.20


  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

      N8N_DB_NAME: "${N8N_DB_NAME:?N8N_DB_NAME is required}"
      N8N_DB_USER: "${N8N_DB_USER:?N8N_DB_USER is required}"
      N8N_DB_PASSWORD: "${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}"

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      backend:
        ipv4_address: 172.30.20.30


  redis:
    image: redis:8.10.1-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    user: redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

    command:
      - sh
      - -c
      - >
        test -n "$$REDIS_PASSWORD" &&
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --save ""
        --appendonly no
        --maxmemory 128mb
        --maxmemory-policy noeviction

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      backend:
        ipv4_address: 172.30.20.40


  n8n:
    image: n8nio/n8n:2.38.7@sha256:a8c95f75c6fdf65f5f2b7a7b354744eaa1c62bb911b5c00af6499c3f38e4cd32

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "${N8N_DB_NAME:?N8N_DB_NAME is required}"
      DB_POSTGRESDB_USER: "${N8N_DB_USER:?N8N_DB_USER is required}"
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}"

      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}"

      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"

      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"

      N8N_SSRF_PROTECTION_ENABLED: "true"

      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""

    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - n8n_data_prod:/home/node/.n8n

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      backend:
        ipv4_address: 172.30.20.50


networks:

  edge:
    driver: bridge

    ipam:
      config:
        - subnet: 172.30.10.0/24


  backend:
    driver: bridge

    ipam:
      config:
        - subnet: 172.30.20.0/24


volumes:

  postgres_data_prod:

  n8n_data_prod:

  caddy_data:

  caddy_config:
