name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict
